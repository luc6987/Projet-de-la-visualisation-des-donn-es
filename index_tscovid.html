<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaccination vs COVID Cases Time Series</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        #wrapper {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        select {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            background: white;
        }

        select:focus {
            outline: none;
            border-color: #3498db;
        }

        #tsCovidPlot {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 500px;
        }

        .loading {
            color: #999;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div id="wrapper">
        <h1>Weekly COVID Cases and Vaccinations - Normalized</h1>
        
        <div class="controls">
            <div class="control-group">
                <label for="countrySelect">Country:</label>
                <select id="countrySelect">
                    <option value="France" selected>France</option>
                    <option value="Germany">Germany</option>
                    <option value="Italy">Italy</option>
                    <option value="Spain">Spain</option>
                    <option value="United Kingdom">United Kingdom</option>
                    <option value="Poland">Poland</option>
                    <option value="Netherlands">Netherlands</option>
                    <option value="Belgium">Belgium</option>
                    <option value="Greece">Greece</option>
                    <option value="Portugal">Portugal</option>
                    <option value="Sweden">Sweden</option>
                    <option value="Austria">Austria</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="startYearSelect">Start Year:</label>
                <select id="startYearSelect">
                    <option value="2020">2020</option>
                    <option value="2021" selected>2021</option>
                    <option value="2022">2022</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="endYearSelect">End Year:</label>
                <select id="endYearSelect">
                    <option value="2021">2021</option>
                    <option value="2022" selected>2022</option>
                    <option value="2023">2023</option>
                </select>
            </div>
        </div>
        
        <div id="tsCovidPlot">
            <div class="loading">Loading data...</div>
        </div>
    </div>
    
    <script type="text/javascript" src="./js/d3.v7.min.js"></script>
    <script type="module">
        import { CleanVaccin } from './js/clean.js';
        import { CleanCovid } from './js/cleanCovid.js';
        import { plotVaccinationVsCases } from './js/tscovid.js';

        let globalVaccinData = null;
        let globalCovidData = null;

        async function initialize() {
            try {
                console.log("Loading data...");
                
                // Load both datasets
                globalVaccinData = await CleanVaccin();
                globalCovidData = await CleanCovid();
                
                console.log(`Vaccination data loaded: ${globalVaccinData.length} records`);
                console.log(`COVID data loaded: ${globalCovidData.length} records`);
                
                // Initial plot
                updatePlot();
                
                // Add event listeners
                document.getElementById('countrySelect').addEventListener('change', updatePlot);
                document.getElementById('startYearSelect').addEventListener('change', updatePlot);
                document.getElementById('endYearSelect').addEventListener('change', updatePlot);
                
            } catch (error) {
                console.error("Error loading data:", error);
                document.getElementById('tsCovidPlot').innerHTML = '<div class="loading">Error loading data</div>';
            }
        }

        function updatePlot() {
            const country = document.getElementById('countrySelect').value;
            const startYear = parseInt(document.getElementById('startYearSelect').value);
            const endYear = parseInt(document.getElementById('endYearSelect').value);
            
            plotVaccinationVsCases(globalVaccinData, globalCovidData, country, startYear, endYear);
        }

        // Initialize on load
        initialize();
    </script>
</body>
</html>
