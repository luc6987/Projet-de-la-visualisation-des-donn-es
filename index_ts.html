<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cumulative Vaccine Uptake - Time Series</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #d7d8da 0%, #e0dfe1 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            font-size: 32px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .description {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.6;
        }

        #controls {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            margin-bottom: 25px;
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            align-items: flex-start;
        }

        .control-group {
            flex: 1;
            min-width: 250px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .control-group select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .control-group select:hover {
            border-color: #667eea;
        }

        .control-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .hint {
            font-size: 12px;
            color: #666;
            margin-top: 6px;
            font-style: italic;
        }

        /* Checkbox grid styles */
        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            background: #fafafa;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .checkbox-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .checkbox-item label {
            font-size: 13px;
            color: #444;
            cursor: pointer;
            margin: 0;
            user-select: none;
        }

        .checkbox-item:hover {
            background: rgba(102, 126, 234, 0.1);
            border-radius: 4px;
            padding: 2px 4px;
            margin: -2px -4px;
        }

        .control-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .control-actions button {
            padding: 6px 12px;
            font-size: 12px;
            border: 1px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-actions button:hover {
            background: #667eea;
            color: white;
        }

        /* Collapsible panel styles */
        .country-selector-wrapper {
            position: relative;
        }

        #toggleCountryPanel {
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #toggleCountryPanel:hover {
            background: #667eea;
            color: white;
        }

        #toggleCountryPanel .arrow {
            transition: transform 0.3s ease;
            font-size: 12px;
        }

        #toggleCountryPanel.open .arrow {
            transform: rotate(180deg);
        }

        .country-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            margin-top: 0;
        }

        .country-panel.open {
            max-height: 300px;
            margin-top: 12px;
        }

        .selected-countries-display {
            margin-top: 8px;
            padding: 8px 12px;
            background: #f0f4ff;
            border-radius: 4px;
            font-size: 12px;
            color: #667eea;
            font-weight: 500;
            min-height: 32px;
        }

        .selected-countries-display span {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            margin: 2px;
            font-size: 11px;
        }

        #chartContainer {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        #tsPlot {
            width: 100%;
            min-height: 600px;
        }

        .grid-y line,
        .grid-x line {
            stroke: #e0e0e0;
        }

        .x-axis path,
        .y-axis path {
            stroke: #333;
        }

        .x-axis line,
        .y-axis line {
            stroke: #666;
        }

        .x-axis text,
        .y-axis text {
            fill: #333;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 24px;
            }

            #controls {
                padding: 15px;
                gap: 15px;
            }

            .control-group {
                min-width: 100%;
            }

            #chartContainer {
                padding: 15px;
            }
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: white;
            font-size: 18px;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }

        .info-panel {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-top: 20px;
        }

        .info-panel h3 {
            color: white;
            margin-bottom: 12px;
            font-size: 18px;
        }

        .info-panel ul {
            margin-left: 20px;
            line-height: 1.8;
            color: #555;
        }

        .info-panel li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
      

        <div id="controls">
            <div class="control-group">
                <label>Countries:</label>
                <div class="country-selector-wrapper">
                    <button id="toggleCountryPanel">
                        <span>Select Countries</span>
                        <span class="arrow">▼</span>
                    </button>
                    <div class="country-panel" id="countryPanel">
                        <div class="checkbox-grid" id="countryCheckboxes">
                            <div class="checkbox-item">
                                <input type="checkbox" id="FR" value="FR" checked>
                                <label for="FR">France</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="DE" value="DE" checked>
                                <label for="DE">Germany</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="IT" value="IT" checked>
                                <label for="IT">Italy</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="ES" value="ES" checked>
                                <label for="ES">Spain</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="PL" value="PL">
                                <label for="PL">Poland</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="RO" value="RO">
                                <label for="RO">Romania</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="NL" value="NL">
                                <label for="NL">Netherlands</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="BE" value="BE">
                                <label for="BE">Belgium</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="CZ" value="CZ">
                                <label for="CZ">Czech Rep.</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="PT" value="PT">
                                <label for="PT">Portugal</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="GR" value="GR">
                                <label for="GR">Greece</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="HU" value="HU">
                                <label for="HU">Hungary</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="SE" value="SE">
                                <label for="SE">Sweden</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="AT" value="AT">
                                <label for="AT">Austria</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="BG" value="BG">
                                <label for="BG">Bulgaria</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="DK" value="DK">
                                <label for="DK">Denmark</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="FI" value="FI">
                                <label for="FI">Finland</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="SK" value="SK">
                                <label for="SK">Slovakia</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="IE" value="IE">
                                <label for="IE">Ireland</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="HR" value="HR">
                                <label for="HR">Croatia</label>
                            </div>
                        </div>
                        <div class="control-actions">
                            <button id="selectAll">Select All</button>
                            <button id="clearAll">Clear All</button>
                        </div>
                    </div>
                    <div class="selected-countries-display" id="selectedCountriesDisplay">
                        <span>France</span><span>Germany</span><span>Italy</span><span>Spain</span>
                    </div>
                </div>
            </div>

            <div class="control-group">
                <label for="doseTypeSelect">Dose Type:</label>
                <select id="doseTypeSelect">
                    <option value="FirstDose">First Dose</option>
                    <option value="SecondDose" selected>Primary Course (2 doses)</option>
                    <option value="DoseAdditional1">First Booster</option>
                    <option value="DoseAdditional2">Second Booster</option>
                    <option value="DoseAdditional3">Third Booster</option>
                </select>
                <p class="hint">Different dose types show different stages of vaccination</p>
            </div>
        </div>

        <div id="chartContainer">
            <div id="tsPlot">
                <div class="loading">Loading vaccination data</div>
            </div>
        </div>

       
    </div>

    <script type="module" src="js/tsPlot.js"></script>
</body>
</html>
