<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ridgeline KDE - Vaccine Distribution</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f6f6f8 0%, #f3f2f4 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            margin-top: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: 600;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            font-weight: 500;
            color: #555;
            font-size: 14px;
        }

        select {
            padding: 8px 15px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 180px;
        }

        select:hover {
            border-color: #667eea;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        #chart {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        #chart svg {
            max-width: 100%;
            height: auto;
        }

        .grid line {
            stroke: #e0e0e0;
        }

        .grid path {
            stroke-width: 0;
        }

        .ridge-area {
            transition: opacity 0.3s ease;
        }

        .ridge-area:hover {
            opacity: 1 !important;
        }

        .info-box {
            background: #e8eaf6;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .info-box p {
            margin: 5px 0;
            font-size: 13px;
            color: #555;
            line-height: 1.6;
        }

        .info-box strong {
            color: #333;
        }

        .tick text {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 16px;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="controls">
            <div class="control-group">
                <label for="modeSelect">Mode:</label>
                <select id="modeSelect">
                    <option value="single">Single Country</option>
                    <option value="compare">Compare Two Countries</option>
                </select>
            </div>
            
            <div id="singleCountryControls" class="control-group">
                <label for="countrySelect">Select Country:</label>
                <select id="countrySelect">
                    <option value="FR" selected>France</option>
                    <option value="DE">Germany (⚠️ No vaccine data)</option>
                    <option value="IT">Italy</option>
                    <option value="ES">Spain</option>
                    <option value="PL">Poland</option>
                    <option value="NL">Netherlands</option>
                    <option value="BE">Belgium</option>
                    <option value="AT">Austria</option>
                    <option value="PT">Portugal</option>
                    <option value="RO">Romania</option>
                    <option value="SE">Sweden</option>
                    <option value="DK">Denmark</option>
                    <option value="FI">Finland</option>
                    <option value="NO">Norway</option>
                    <option value="GR">Greece</option>
                    <option value="CZ">Czechia</option>
                    <option value="HU">Hungary</option>
                    <option value="IE">Ireland</option>
                    <option value="HR">Croatia</option>
                    <option value="BG">Bulgaria</option>
                </select>
            </div>
            
            <div id="compareCountryControls" class="control-group" style="display: none; gap: 15px;">
                <label for="country1Select">Country 1:</label>
                <select id="country1Select">
                    <option value="FR" selected>France</option>
                    <option value="DE">Germany (⚠️ No vaccine data)</option>
                    <option value="IT">Italy</option>
                    <option value="ES">Spain</option>
                    <option value="PL">Poland</option>
                    <option value="NL">Netherlands</option>
                    <option value="BE">Belgium</option>
                    <option value="AT">Austria</option>
                    <option value="PT">Portugal</option>
                    <option value="RO">Romania</option>
                    <option value="SE">Sweden</option>
                    <option value="DK">Denmark</option>
                    <option value="FI">Finland</option>
                    <option value="NO">Norway</option>
                    <option value="GR">Greece</option>
                    <option value="CZ">Czechia</option>
                    <option value="HU">Hungary</option>
                    <option value="IE">Ireland</option>
                    <option value="HR">Croatia</option>
                    <option value="BG">Bulgaria</option>
                </select>
                
                <label for="country2Select">Country 2:</label>
                <select id="country2Select">
                    <option value="FR">France</option>
                    <option value="DE">Germany (⚠️ No vaccine data)</option>
                    <option value="IT" selected>Italy</option>
                    <option value="ES">Spain</option>
                    <option value="PL">Poland</option>
                    <option value="NL">Netherlands</option>
                    <option value="BE">Belgium</option>
                    <option value="AT">Austria</option>
                    <option value="PT">Portugal</option>
                    <option value="RO">Romania</option>
                    <option value="SE">Sweden</option>
                    <option value="DK">Denmark</option>
                    <option value="FI">Finland</option>
                    <option value="NO">Norway</option>
                    <option value="GR">Greece</option>
                    <option value="CZ">Czechia</option>
                    <option value="HU">Hungary</option>
                    <option value="IE">Ireland</option>
                    <option value="HR">Croatia</option>
                    <option value="BG">Bulgaria</option>
                </select>
            </div>
        </div>

        <div id="chart">
            <div class="loading">Loading data</div>
        </div>
    </div>

    <script type="module" src="./js/kernelPlot.js?v=9"></script>
</body>
</html>
